name: Docker Image CI

on:
  push:
    tags:
      - '8.*-fpm'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and push (must match Dockerfile PHP version)'
        required: true
        default: '8.5.12-fpm'

permissions:
  contents: read

env:
  IMAGE_NAME: zgldh/docker-php-core

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and validate image tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          base_tag="$(sed -n 's/^FROM php:\([^ ]*\).*/\1/p' Dockerfile)"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            tag="test-${GITHUB_SHA}"
          else
            tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
            if [[ ! "$tag" =~ ^8\.[0-9]+\.[0-9]+-fpm$ ]] || [ "$tag" != "$base_tag" ]; then
              echo "Release tag must match Dockerfile base tag: $base_tag" >&2
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "php_version=${base_tag%-fpm}" >> "$GITHUB_OUTPUT"
          echo "Image tag: $tag"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify PHP, extensions and tools
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          PHP_VERSION: ${{ steps.meta.outputs.php_version }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh \
            -v "$PWD/tests:/tests:ro" "$IMAGE" /tests/smoke.sh "$PHP_VERSION"

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: zgldh
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push verified image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
        run: docker push "$IMAGE"

      - name: Image summary
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
        run: |
          docker image inspect "$IMAGE" --format '{{.Id}} {{.Created}}'
          echo "### Verified image: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
